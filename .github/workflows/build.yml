name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  kafatakip:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    defaults:
      run:
        working-directory: kafatakip
    steps:
      - uses: actions/checkout@v4

      - name: Derle
        run: make

      - name: .3dsx dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: kafatakip
          path: kafatakip/kafatakip.3dsx
          if-no-files-found: error

  plugin:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    defaults:
      run:
        working-directory: plugin
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: CTRPluginFramework ve 3gxtool kur
        run: |
          PAC=$(command -v dkp-pacman || command -v pacman)
          CONF=/opt/devkitpro/pacman/etc/pacman.conf
          [ -f "$CONF" ] || CONF=/etc/pacman.conf
          # pkg.devkitpro.org CI'dan senkronizasyonu reddediyor (403); toolchain
          # imajda zaten kurulu. Sadece ThePixellizerOSS depolarıyla ayrı bir
          # yapılandırma kullan.
          sed '/^\[dkp-/,/^$/d' "$CONF" > /tmp/ctrpf-pacman.conf
          printf '\n[thepixellizeross-lib]\nServer = https://thepixellizeross.gitlab.io/packages/any\nSigLevel = Optional\n' >> /tmp/ctrpf-pacman.conf
          printf '\n[thepixellizeross-linux]\nServer = https://thepixellizeross.gitlab.io/packages/x86_64/linux\nSigLevel = Optional\n' >> /tmp/ctrpf-pacman.conf
          grep -n '^\[' /tmp/ctrpf-pacman.conf
          "$PAC" --config /tmp/ctrpf-pacman.conf -Sy --noconfirm --needed libctrpf 3gxtool

      - name: Derle
        run: |
          make
          make TARGET=KafaTakipTest BUILD=build-test DEFINES=-DKAFATAKIP_MINIMAL

      - name: .3gx dosyalarini yukle
        uses: actions/upload-artifact@v4
        with:
          name: kafatakip-plugin
          path: |
            plugin/KafaTakip.3gx
            plugin/KafaTakipTest.3gx
          if-no-files-found: error

  # master'a her push'ta dosyalar sabit "son" sürümüne konur; Release dosyaları
  # Artifacts'ın aksine GitHub'a giriş yapmadan ve zip'siz indirilebilir.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [kafatakip, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: "\"son\" surumunu guncelle"
        run: |
          gh release delete son --cleanup-tag --yes || true
          gh release create son --target "$GITHUB_SHA" --prerelease \
            --title "Son derleme" \
            --notes "master'daki son derleme (commit ${GITHUB_SHA::7}). kafatakip.3dsx: /3ds/ klasorune. KafaTakip.3gx: /luma/plugins/default.3gx olarak." \
            dist/kafatakip/kafatakip.3dsx dist/kafatakip-plugin/KafaTakip.3gx dist/kafatakip-plugin/KafaTakipTest.3gx
