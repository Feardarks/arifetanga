name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  kafatakip:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    defaults:
      run:
        working-directory: kafatakip
    steps:
      - uses: actions/checkout@v4

      - name: Derle
        run: make

      - name: .3dsx dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: kafatakip
          path: kafatakip/kafatakip.3dsx
          if-no-files-found: error
