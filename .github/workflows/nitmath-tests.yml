name: NitMath testleri

# Renk matematiği, Nit eğrisi, headroom süzgeci ve Tepe Kilidi saf Swift'tir; ucuz Linux runner'ında test edilir.
on:
  workflow_dispatch:
  push:
    paths:
      - "Packages/NitMath/**"
      - ".github/workflows/nitmath-tests.yml"
  pull_request:
    paths:
      - "Packages/NitMath/**"

jobs:
  test:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --package-path Packages/NitMath
