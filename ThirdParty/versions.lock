# Native bağımlılık sürümleri (02-cozum §8.5). Bu dosya ya da betikler değişince CI önbelleği yenilenir.
IOS_MIN=18.0
# FFmpeg: yalnızca LGPL bileşenleri (demux, parser, bsf, ses çözücüleri). S6: müzik dosyaları için
# FLAC/WAV/AIFF/CAF/MP3/Ogg/WavPack/APE çözümleyicileri. Video çözme VideoToolbox'ta;
# AC-3/E-AC-3 (Atmos dahil) sıkıştırılmış olarak Apple'a gider (S3).
FFMPEG_VERSION=8.0
# libdovi (dovi_tool deposundaki dolby_vision crate'i, MIT). Sabit commit; günlükte yazılır.
DOVI_TOOL_REPO=https://github.com/quietvoid/dovi_tool
DOVI_TOOL_REF=main
# libsmb2 (SMB2/3 istemcisi, LGPL-2.1; statik). S7: ağ oynatma (AS-3, AS-23). Kerberos kapalı (NTLMSSP).
LIBSMB2_REPO=https://github.com/sahlberg/libsmb2
LIBSMB2_REF=libsmb2-6.3.1
